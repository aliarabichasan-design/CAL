<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آلة حاسبة - ٠٠٠ و ٠٠٠٠٠٠</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--text:#1a1a1a;--key:#ececea;--op:#e8a33d;--opt:#fff;--zero:#2f7d6d;--zerot:#fff;--clr:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#232323;--text:#f1f1f1;--key:#333;}}
:root[data-theme="dark"]{--bg:#161616;--card:#232323;--text:#f1f1f1;--key:#333}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;padding:16px}
.calc{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.screen{direction:ltr;text-align:right;min-height:88px;padding:8px 6px;overflow-x:auto}
.expr{font-size:16px;opacity:.6;min-height:22px;white-space:nowrap}
.val{font-size:38px;font-weight:600;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;direction:ltr}
button{font-size:22px;padding:16px 0;border:0;border-radius:14px;background:var(--key);color:var(--text);cursor:pointer}
button:active{transform:scale(.96)}
.op{background:var(--op);color:var(--opt)}
.zero{background:var(--zero);color:var(--zerot);font-size:18px}
.clr{background:var(--clr);color:#fff}
.w2{grid-column:span 2}
</style>
</head>
<body>
<div class="calc">
  <div class="screen"><div class="expr" id="expr"></div><div class="val" id="val">0</div></div>
  <div class="grid">
    <button class="clr" onclick="clr()">C</button>
    <button onclick="back()">⌫</button>
    <button class="op" onclick="op('%')">%</button>
    <button class="op" onclick="op('÷')">÷</button>

    <button onclick="d('7')">7</button><button onclick="d('8')">8</button><button onclick="d('9')">9</button>
    <button class="op" onclick="op('×')">×</button>

    <button onclick="d('4')">4</button><button onclick="d('5')">5</button><button onclick="d('6')">6</button>
    <button class="op" onclick="op('-')">−</button>

    <button onclick="d('1')">1</button><button onclick="d('2')">2</button><button onclick="d('3')">3</button>
    <button class="op" onclick="op('+')">+</button>

    <button onclick="d('0')">0</button>
    <button class="zero" onclick="d('000')">000</button>
    <button class="zero" onclick="d('000000')">000000</button>
    <button onclick="d('.')">.</button>

    <button class="op w2" style="grid-column:span 4" onclick="eq()">=</button>
  </div>
</div>
<script>
let cur="0",prev=null,oper=null,fresh=false;
const $=id=>document.getElementById(id);
function fmt(s){
  if(s==="Error")return s;
  let [i,f]=s.split(".");
  let neg=i.startsWith("-");if(neg)i=i.slice(1);
  i=i.replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"-":"")+i+(f!==undefined?"."+f:"");
}
function show(){
  $("val").textContent=fmt(cur);
  $("expr").textContent=prev!==null?fmt(prev)+" "+oper:"";
}
function d(x){
  if(fresh){cur="0";fresh=false}
  if(x==="."){if(cur.includes("."))return;cur+=".";}
  else if(cur==="0")cur=(x==="0"||x==="000"||x==="000000")?"0":x;
  else cur+=x;
  show();
}
function calc(a,b,o){
  a=parseFloat(a);b=parseFloat(b);
  let r;
  if(o==="+")r=a+b;else if(o==="-")r=a-b;else if(o==="×")r=a*b;
  else if(o==="÷"){if(b===0)return "Error";r=a/b;}
  else if(o==="%")r=a*b/100;
  return String(parseFloat(r.toPrecision(12)));
}
function op(o){
  if(prev!==null&&!fresh){cur=calc(prev,cur,oper);}
  prev=cur;oper=o;fresh=true;show();
}
function eq(){
  if(prev===null)return;
  cur=calc(prev,cur,oper);prev=null;oper=null;fresh=true;show();
}
function clr(){cur="0";prev=null;oper=null;fresh=false;show()}
function back(){
  if(fresh||cur==="Error"){cur="0"}else{cur=cur.length>1?cur.slice(0,-1):"0"}
  if(cur==="-")cur="0";show();
}
show();
</script>
</body>
</html>
